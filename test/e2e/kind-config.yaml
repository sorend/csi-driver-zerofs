kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# The Kubernetes external storage e2e suite mounts a volume from pods that are
# scheduled on different nodes (multiVolume, Disruptive, topology-adjacent
# tests), so a single-node cluster would only ever exercise one code path.
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            allowed-unsafe-sysctls: "net.*"
  - role: worker
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
  - role: worker
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
  - role: worker
    extraMounts:
      - hostPath: /dev
        containerPath: /dev