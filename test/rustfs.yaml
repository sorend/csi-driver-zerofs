---
# RustFS deployment for integration testing
# S3-compatible object storage backend used in place of MinIO.
# Deploy to zerofs-csi namespace alongside the CSI driver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: zerofs-csi
  labels:
    app: rustfs
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: s3-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          args:
            - /data
          env:
            - name: RUSTFS_ACCESS_KEY
              value: minioadmin
            - name: RUSTFS_SECRET_KEY
              value: minioadmin123
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: zerofs-csi
  labels:
    app: rustfs
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: s3-backend
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001