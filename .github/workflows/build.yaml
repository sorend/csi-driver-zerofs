name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate GoReleaser config
        run: make release-check

      - name: Run tests
        run: make test

      - name: Build Docker image
        run: make docker-build

  sanity-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run csi-sanity
        env:
          KIND_CLUSTER: zerofs-sanity
          DRIVER_IMAGE: ghcr.io/${{ github.repository }}:latest
          KEEP_CLUSTER: 1
        run: |
          make csi-sanity-install
          ./test/sanity/run-sanity.sh

      - name: Dump csi-sanity logs on failure
        if: failure()
        run: |
          kubectl logs -n zerofs-csi zerofs-csi-sanity -c zerofs-plugin --tail=200 || true
          kubectl logs -n zerofs-csi deployment/zerofs-csi-controller -c zerofs-plugin --tail=100 || true

      - name: Upload csi-sanity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-sanity
          path: /tmp/csi-sanity/junit_sanity.xml
          if-no-files-found: ignore

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name zerofs-sanity

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CSI driver image (amd64, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: zerofs-integration
          config: test/kind-config.yaml
          wait: 60s

      - name: Install bats
        run: |
          sudo apt-get install -y bats

      - name: Load CSI driver image into kind
        run: |
          kind load docker-image \
            ghcr.io/${{ github.repository }}:latest \
            --name zerofs-integration

      - name: Pull zerofs server image into kind node
        run: |
          docker exec zerofs-integration-control-plane \
            ctr --namespace=k8s.io images pull \
            ghcr.io/barre/zerofs:1.0.4

      - name: Deploy CSI driver
        run: |
          kubectl apply -f deploy/install.yaml
          kubectl apply -f deploy/storageclasses.yaml
          kubectl patch deployment zerofs-csi-controller \
            -n zerofs-csi \
            --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"zerofs-plugin","imagePullPolicy":"Never"}]}}}}'
          kubectl patch daemonset zerofs-csi-node \
            -n zerofs-csi \
            --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"zerofs-plugin","imagePullPolicy":"Never"}]}}}}'
          kubectl rollout status deployment/zerofs-csi-controller \
            -n zerofs-csi --timeout=120s
          kubectl rollout status daemonset/zerofs-csi-node \
            -n zerofs-csi --timeout=120s

      - name: Deploy RustFS
        run: |
          kubectl apply -f test/rustfs.yaml
          kubectl rollout status deployment/rustfs \
            -n zerofs-csi --timeout=120s

      - name: Create S3 bucket
        run: |
          kubectl run s3-init \
            --image=amazon/aws-cli:latest \
            --restart=Never \
            -n zerofs-csi \
            --env=AWS_ACCESS_KEY_ID=minioadmin \
            --env=AWS_SECRET_ACCESS_KEY=minioadmin123 \
            --env=AWS_DEFAULT_REGION=us-east-1 \
            --command -- /bin/sh -c \
            "aws --endpoint-url http://rustfs.zerofs-csi.svc.cluster.local:9000 s3api head-bucket --bucket zerofs-data >/dev/null 2>&1 || aws --endpoint-url http://rustfs.zerofs-csi.svc.cluster.local:9000 s3 mb s3://zerofs-data"
          kubectl wait pod/s3-init \
            -n zerofs-csi \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=120s

      - name: Run integration tests
        run: |
          bats test/integration-test.bats

      - name: Dump debug info on failure
        if: failure()
        run: |
          echo "=== CSI controller logs ==="
          kubectl logs -n zerofs-csi deployment/zerofs-csi-controller \
            -c zerofs-plugin --tail=100 || true
          echo "=== CSI provisioner logs ==="
          kubectl logs -n zerofs-csi deployment/zerofs-csi-controller \
            -c csi-provisioner --tail=100 || true
          echo "=== CSI node logs ==="
          kubectl logs -n zerofs-csi daemonset/zerofs-csi-node \
            -c zerofs-plugin --tail=50 || true
          echo "=== PVCs ==="
          kubectl get pvc -A || true
          echo "=== PVs ==="
          kubectl get pv || true
          echo "=== Pods ==="
          kubectl get pods -A || true
          echo "=== Deployments in zerofs-csi ==="
          kubectl get deployments -n zerofs-csi || true
